<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLD Token Balance</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
</head>
<body>
  <h1>ERC20 balanceOf on Sepolia</h1>
  <p>Contract: GLDToken (Gold / GLD)</p>
  <button id="getBalanceBtn">Get My GLD Balance</button>
  <p id="result">Click the button to call balanceOf() with your MetaMask account.</p>

  <script>
    const ERC20_CONTRACT_ADDRESS = "0xBF714941C6f419895e4dC1153b92D76E15e38a79";
    const SEPOLIA_CHAIN_ID = 11155111n;
    const SEPOLIA_CHAIN_ID_HEX = "0xaa36a7";

    const ERC20_ABI = [
      "function balanceOf(address account) view returns (uint256)",
      "function decimals() view returns (uint8)",
      "function symbol() view returns (string)"
    ];

    document.getElementById("getBalanceBtn").addEventListener("click", async () => {
      const resultEl = document.getElementById("result");

      try {
        if (!window.ethereum) {
          resultEl.textContent = "MetaMask not found. Please install MetaMask.";
          return;
        }

        const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
        const account = accounts[0];

        const provider = new ethers.BrowserProvider(window.ethereum);
        let network = await provider.getNetwork();

        if (network.chainId !== SEPOLIA_CHAIN_ID) {
          resultEl.textContent = "Please switch MetaMask to Sepolia testnet...";
          await window.ethereum.request({
            method: "wallet_switchEthereumChain",
            params: [{ chainId: SEPOLIA_CHAIN_ID_HEX }],
          });
          network = await provider.getNetwork();
        }

        if (network.chainId !== SEPOLIA_CHAIN_ID) {
          resultEl.textContent = "MetaMask is not connected to Sepolia.";
          return;
        }

        const token = new ethers.Contract(ERC20_CONTRACT_ADDRESS, ERC20_ABI, provider);
        const [balance, decimals, symbol] = await Promise.all([
          token.balanceOf(account),
          token.decimals(),
          token.symbol(),
        ]);

        const formattedBalance = ethers.formatUnits(balance, decimals);

        resultEl.textContent =
          `Account: ${account}\n` +
          `balanceOf(${account}) = ${balance.toString()}\n` +
          `Formatted balance: ${formattedBalance} ${symbol}`;
      } catch (error) {
        resultEl.textContent = `Error: ${error.message}`;
      }
    });
  </script>
</body>
</html>
